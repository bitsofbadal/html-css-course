<style>
.strech-button{
  background-color:green;
  color:white;
  border:none;
  padding-top:10px;
  padding-bottom:10px;
  padding-left:20px;
  padding-right:20px;
  font-size:30px;
  cursor:pointer;
  transition:padding-top 1s, padding-bottom 1s , padding-left 1s, padding-right 1s;

}
.strech-button:hover{
  padding-top:20px;
  padding-bottom:20px;
  padding-left:60px;
  padding-right:60px;
}
.shadow-button{
  background-color:green;
  color:white;
  border:none;
  padding-top:10px;
  padding-bottom:10px;
  padding-left:20px;
  padding-right:20px;
  font-size:30px;
  margin-left:10px;
  margin-right:10px;
  box-shadow:5px 5px 5px rgba(0,0,0,0.4);
  cursor:pointer;
}

.shadow-button:active{
    margin-left: 15px;
    margin-right: 5px;
    transform: translateY(4px);
    box-shadow: none;
}
.num-button{
background-color:green;
color:white;
border:none;
margin-left:10px;
margin-right:10px;
padding-top:15px;
padding-bottom:15px;
padding-left:20px;
padding-right:20px;
cursor:pointer;
font-size:20px;
transition:padding-right 0.15s,padding-left 0.15s, margin-left 0.15s, margin-right 0.15s;
}
.num-button:hover{
  padding-right:35px;
  padding-left:35px;
  margin-left:0px;
  margin-right:0px;
}
</style>
<button class="strech-button">Strech</button>
<button class="shadow-button">Shadow</button>
<button class="num-button" >One</button>
<button class="num-button">Two</button>
<button class="num-button">Three</button>
