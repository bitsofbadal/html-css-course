
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Birthday Surprise 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">A LITTLE SURPRISE FOR YOU</p>

    <h1>Happy Birthday! 🎂</h1>
    <p class="subtitle">Someone special deserves something beautiful.</p>

    <div class="scene">
      <div class="sparkles">✦　·　✧　·　✦</div>

      <button id="heart" class="heart" aria-label="Open your birthday gift">
        💗
      </button>

      <div class="ground"></div>
      <p class="hint">Tap the heart to open your gift</p>
    </div>

    <section id="wish" class="wish" aria-live="polite">
      <h2>For You 💌</h2>
      <p>
        May your life be filled with happiness, love,
        beautiful memories, and dreams that come true.
      </p>
      <p class="signature">You deserve all the good things. 💖</p>
    </section>

    <button id="replay" class="replay">Make a wish ✨</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
